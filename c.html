<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>项目进度</title>
<style>
:root{color-scheme:light;--bg:#eef0f4;--panel:#fff;--panel2:#f4f5f8;--ink:#1b1d22;--ink2:#5d6470;--line:#e2e5ea;--accent:#2b5cd9;--ok:#178a4b;--ok-soft:#e2f4ea;--danger:#c2413c;--danger-soft:#fbe7e6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sub{color:var(--ink2);font-size:13px}
h1{font-size:20px;margin:4px 0 2px}
.big{font-size:30px;font-weight:700;margin:2px 0}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}
.ms{display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #c3c8d1;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.m.done .dot{background:var(--ok);border-color:var(--ok)}
.m.active .dot{border-color:var(--accent);box-shadow:inset 0 0 0 3px #fff;background:var(--accent)}
.m b{font-weight:600}
.m .r{text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:12px}
.up{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.up:first-child{border-top:0}
.up .t{color:var(--ink2);min-width:70px}
.up img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.foot{text-align:center;color:var(--ink2);font-size:12px}
.empty{text-align:center;color:var(--ink2);padding:60px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">加载中…</div></div>
<script>
(function(){
"use strict";
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(s){if(!s)return '';var a=s.split('-');return (+a[1])+'月'+(+a[2])+'日';}
var seg=location.pathname.split('/').filter(Boolean),tok=seg[1]||new URLSearchParams(location.search).get('t')||'',root='../'.repeat(location.pathname.split('/').length-2);
var app=document.getElementById('app');
function load(){
  fetch(root+'api/c/'+encodeURIComponent(tok),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){app.innerHTML='<div class="empty">'+esc(j.error||'链接已失效')+'</div>';return;}
    document.title=j.project.name+' · 项目进度';
    var h='<div class="card"><div class="sub">'+esc(j.project.customer)+(j.project.code?' · 合同 '+esc(j.project.code):'')+'</div><h1>'+esc(j.project.name)+'</h1>';
    if(j.done)h+='<div class="big" style="color:var(--ok)">已交付</div>';
    else if(j.fc)h+='<div class="sub" style="margin-top:8px">预计交付</div><div class="big">'+md(j.fc)+'</div>';
    h+='<div class="bar"><i style="width:'+j.pct+'%"></i></div><div class="sub">整体进度 '+j.pct+'% · 数据更新于 '+md(j.today)+'</div></div>';
    if(j.delay)h+='<div class="warn">较原计划('+md(j.plan)+')预计晚 '+j.delay.days+' 天'+(j.delay.reasons.length?',主要原因:'+esc(j.delay.reasons.join('、')):'')+'。我们正在全力追赶,如有疑问请联系项目负责人。</div>';
    h+='<div class="card"><div class="ms">'+j.milestones.map(function(m){return '<div class="m '+m.s+'"><span class="dot">'+(m.s==='done'?'✓':'')+'</span><div><b>'+esc(m.name)+'</b><div class="sub">'+(m.s==='done'?'已完成':(m.s==='active'?'进行中':'未开始'))+(m.pct!=null&&m.s==='active'?' · '+m.pct+'%':'')+'</div></div><div class="r">'+(m.start?md(m.start)+'<br>– '+md(m.end):'')+'</div></div>';}).join('')+'</div></div>';
    if(j.updates&&j.updates.length)h+='<div class="card"><div class="sub" style="margin-bottom:4px">最新进展</div>'+j.updates.map(function(u){var d=new Date(u.ts);return '<div class="up"><span class="t">'+(d.getMonth()+1)+'月'+d.getDate()+'日</span><span style="flex:1">'+esc(u.text)+'</span>'+(u.photo?'<a href="'+esc(root+u.photo)+'" target="_blank"><img src="'+esc(root+u.photo)+'" alt="现场照片"></a>':'')+'</div>';}).join('')+'</div>';
    h+='<div class="foot">页面每 5 分钟自动刷新 · 擎图交付管家</div>';
    app.innerHTML=h;
  }).catch(function(){app.innerHTML='<div class="empty">网络连接失败,请稍后重试</div>';});
}
load();setInterval(load,300000);
})();
</script>
</body>
</html>
